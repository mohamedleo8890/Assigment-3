<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact us using the form on this page.">
  <title>Contact Us - My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="logo" href="Home.html">My Website</a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="Home.html">Home</a></li>
        <li><a href="aboutus.html">About Us</a></li>
        <li><a href="contactus.html" aria-current="page">Contact Us</a></li>
        <li><a href="components.html">Components</a></li>
        <li><a href="validation.html">Registration</a></li>
        <li><a href="data.html">Data Table</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <section class="hero">
      <h1>Contact Us</h1>
      <p>Please fill out the form below to reach out to us.</p>
    </section>
    <section class="card">
      <form action="#" method="post">
        <div class="form-field">
          <label for="name">Full Name <span aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email Address <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" placeholder="example@domain.com" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="1" max="100" placeholder="e.g. 20">
        </div>
        <div class="form-field">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" autocomplete="bday">
        </div>
        <fieldset>
          <legend>Gender</legend>
          <div class="choice-row">
            <label class="choice" for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
            <label class="choice" for="female"><input type="radio" id="female" name="gender" value="female"> Female</label>
            <label class="choice" for="prefer-not-to-say"><input type="radio" id="prefer-not-to-say" name="gender" value="prefer-not-to-say"> Prefer not to say</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Interests</legend>
          <div class="choice-row">
            <label class="choice" for="coding"><input type="checkbox" id="coding" name="interests" value="coding"> Coding</label>
            <label class="choice" for="sports"><input type="checkbox" id="sports" name="interests" value="sports"> Sports</label>
            <label class="choice" for="gaming"><input type="checkbox" id="gaming" name="interests" value="gaming"> Gaming</label>
          </div>
        </fieldset>
        <div class="form-field">
          <label for="subject">Subject / Department</label>
          <select id="subject" name="subject">
            <option value="">-- Please Select --</option>
            <option value="general">General Inquiry</option>
            <option value="support">Technical Support</option>
            <option value="feedback">Feedback</option>
          </select>
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
        </div>
        <p class="help-text">Fields marked with * are required.</p>
        <button type="submit">Submit</button>
      </form>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>&copy; 2026 My Website. All rights reserved.</p></div></footer>
</body>
</html>
